services:
  script-manager:
    build:
      context: .
    container_name: script-manager
    environment:
      - PUID=1000
      - PGID=1000
      # REQUIRED: set a long random token and enter it in the UI.
      # Generate: openssl rand -hex 32
      - API_TOKEN=change-me-to-a-long-random-token
      - SCRIPT_MAX_RAM_MB=512
      - SCRIPT_MAX_CPU_SEC=3600
      - PORT_START=9051
      - PORT_END=9075
      # Execution backend: subprocess = venvs in this container (default, no
      # extra privileges). auto = services run as inner Podman containers when
      # podman works, jobs stay subprocess. No docker.sock is ever mounted —
      # inner containers cannot reach your host's Docker daemon.
      - EXEC_BACKEND=subprocess
      - TZ=Etc/UTC
    # --- Opt in to containers-in-container for services: ---
    # 1. set EXEC_BACKEND=auto above
    # 2. uncomment the lines below (inner OCI networking/storage needs these
    #    on THIS container only; the host Docker daemon is still untouched —
    #    no socket mount, no host mounts).
    # security_opt:
    #   - seccomp:unconfined
    #   - apparmor:unconfined
    #   - systempaths:unconfined
    # cap_add:
    #   - SYS_ADMIN
    #   - MKNOD
    #   - NET_ADMIN
    # devices:
    #   - /dev/fuse
    #   - /dev/net/tun:/dev/net/tun
    ports:
      - "9050:8080"
      # Expose a sane range for user Flask apps. Map 1:1 so :9051 in
      # container == :9051 on host. Adjust to taste.
      - "9051-9075:9051-9075"
    volumes:
      - ./script-manager/scripts:/scripts
      - ./script-manager/data:/data
    restart: unless-stopped
